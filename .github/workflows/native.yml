name: Native macOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q
      - run: python build.py
      - name: Launch packaged native app
        shell: bash
        run: |
          mkdir -p validation
          dist/AmerikaSocial.app/Contents/MacOS/AmerikaSocial --smoke-test validation/native-smoke.png
          test -s validation/native-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: AmerikaSocial-macOS
          path: |
            release/*
            validation/*.png
          if-no-files-found: error
          retention-days: 14
